[project]
name = "nikon-firmware-tools"
version = "0.1.0"
description = "Reverse engineering and firmware analysis tools for Nikon DSLRs and Z-series mirrorless cameras"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nikon Hacker Team" }
]
license = { text = "GPL-2.0-or-later / BSD-3-Clause" }
dependencies = []

[project.optional-dependencies]
reversing = [
    "capstone>=5.0.0",
    "pycryptodome>=3.20.0",
    "unicorn>=2.0.0",
]
test = [
    "pytest>=8.0.0",
]
all = [
    "capstone>=5.0.0",
    "pycryptodome>=3.20.0",
    "unicorn>=2.0.0",
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "capstone>=5.0.0",
    "pycryptodome>=3.20.0",
    "unicorn>=2.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["firmware decode/z-series/tools"]
python_files = ["test_*.py"]
python_classes = ["*Tests", "Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "firmware decode/z-series/analysis/**/versions/**",
    "firmware decode/z-series/qemu/**",
    "*.bin*",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
